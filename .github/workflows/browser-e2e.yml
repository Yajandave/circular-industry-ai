name: Browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  browser-e2e:
    name: Chromium UI journeys
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: sqlite:////tmp/circular-industry-browser-e2e.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and pinned browser-test runner
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real browser journeys
        working-directory: frontend
        run: npx playwright test --config=playwright.config.js
      - name: Save failing browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
